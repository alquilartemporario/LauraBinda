<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Alquiler Temporarios</title>

<meta
  name="description"
  content="Encontrá departamentos temporarios disponibles."
>

<meta
  name="theme-color"
  content="#006eff"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:#f5f7fa;
  color:#172033;
  line-height:1.5;

  -webkit-font-smoothing:antialiased;

  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body.modal-open{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --primary:#006eff;
  --primary-dark:#0056cc;

  --active:#16a34a;
  --active-dark:#15803d;

  --text:#172033;
  --text-soft:#667085;

  --background:#f5f7fa;
  --white:#ffffff;

  --border:#e5e7eb;

  --success:#16a34a;
  --danger:#dc3545;

  --shadow-sm:
    0 3px 12px rgba(16,24,40,.07);

  --shadow:
    0 8px 28px rgba(16,24,40,.09);

  --shadow-lg:
    0 20px 60px rgba(16,24,40,.16);

  --radius:18px;
  --radius-sm:12px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  width:100%;
  max-width:100%;
  background:var(--primary);
  overflow:hidden;
}

.hero-image{
  position:relative;
  width:100%;
  height:330px;

  background:
    linear-gradient(
      135deg,
      #e8edf3,
      #dfe5ec
    );

  overflow:hidden;
}

.hero-background{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;

  transition:
    opacity .25s ease;
}

.hero-image-overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.04),
      rgba(0,0,0,.22)
    );

  pointer-events:none;
}

.hero-bottom{
  width:100%;

  background:var(--primary);
  color:white;

  text-align:center;

  padding:
    30px 20px 34px;
}

.hero-content{
  width:min(
    1100px,
    calc(100% - 20px)
  );

  margin:0 auto;
}

.hero-title{
  font-size:
    clamp(
      2rem,
      5vw,
      3.8rem
    );

  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.05;

  margin-bottom:10px;
}

.hero-subtitle{
  font-size:
    clamp(
      1rem,
      2vw,
      1.25rem
    );

  font-weight:400;
  opacity:.95;

  max-width:700px;
  margin:0 auto;
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:min(
    1200px,
    calc(100% - 32px)
  );

  margin:0 auto;

  padding:
    30px 0 100px;
}


/* =========================================================
   FILTER PANEL
========================================================= */

.filters{
  background:white;

  border:
    1px solid
    var(--border);

  border-radius:var(--radius);

  box-shadow:var(--shadow);

  padding:20px;

  margin-bottom:28px;

  position:relative;
  z-index:10;
}

.filters-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:16px;

  margin-bottom:17px;
}

.filters-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.02em;
}

.results-count{
  color:var(--text-soft);
  font-size:13px;
  margin-top:2px;
}

.filter-grid{
  display:grid;

  grid-template-columns:
    minmax(0,1.25fr)
    minmax(250px,.75fr);

  gap:18px;
}

.filter-group{
  display:flex;
  flex-direction:column;

  gap:8px;

  min-width:0;
}

.filter-label{
  font-size:11px;
  font-weight:800;

  color:var(--text-soft);

  text-transform:uppercase;
  letter-spacing:.06em;
}


/* =========================================================
   ENVIRONMENT BUTTONS
========================================================= */

.environment-buttons{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(85px,1fr)
    );

  gap:8px;

  width:100%;
}

.environment-button{
  min-height:42px;

  border:
    1px solid
    var(--border);

  background:#fff;
  color:var(--text);

  border-radius:10px;

  font-weight:700;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.environment-button:hover{
  border-color:var(--active);
  transform:translateY(-1px);
}

.environment-button.active{
  background:var(--active);
  border-color:var(--active);
  color:white;

  box-shadow:
    0 4px 12px
    rgba(22,163,74,.22);
}


/* =========================================================
   BARRIO
========================================================= */

.select-wrapper{
  position:relative;
  width:100%;
}

.select-wrapper::after{
  content:"⌄";

  position:absolute;

  right:15px;
  top:50%;

  transform:translateY(-55%);

  color:#667085;

  pointer-events:none;

  font-size:18px;
}

.neighborhood-select{
  width:100%;
  min-height:44px;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  background:white;

  padding:
    0 42px 0 14px;

  outline:none;

  color:var(--text);

  appearance:none;

  cursor:pointer;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.neighborhood-select:focus{
  border-color:var(--active);

  box-shadow:
    0 0 0 3px
    rgba(22,163,76,.12);
}


/* =========================================================
   AMENITY FILTERS
========================================================= */

.amenity-filters{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:16px;

  width:100%;
}

.amenity-button{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:7px;

  min-height:40px;

  padding:
    0 14px;

  border:
    1px solid
    var(--border);

  background:#fff;

  color:var(--text);

  border-radius:999px;

  font-size:13px;
  font-weight:700;

  transition:all .2s ease;
}

.amenity-button:hover{
  border-color:var(--active);
}

.amenity-button.active{
  background:var(--active);
  color:white;
  border-color:var(--active);

  box-shadow:
    0 4px 12px
    rgba(22,163,74,.20);
}


/* =========================================================
   CLEAR FILTERS
========================================================= */

.clear-filters{
  border:none;

  background:transparent;

  color:var(--text-soft);

  font-weight:700;
  font-size:13px;

  padding:4px 0;

  transition:color .2s ease;
}

.clear-filters:hover{
  color:var(--active);
  text-decoration:underline;
}


/* =========================================================
   PROPERTY GRID
========================================================= */

.properties-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(320px,1fr)
    );

  gap:22px;

  width:100%;
}


/* =========================================================
   PROPERTY CARD
========================================================= */

.property-card{
  background:white;

  border:
    1px solid
    var(--border);

  border-radius:var(--radius);

  overflow:hidden;

  /* SOMBRA TENUE SOLICITADA */
  box-shadow:
    0 6px 20px
    rgba(16,24,40,.075);

  transition:
    transform .25s ease,
    box-shadow .25s ease;

  display:flex;
  flex-direction:column;

  min-width:0;
  width:100%;
}

.property-card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 12px 32px
    rgba(16,24,40,.11);
}


/* =========================================================
   PROPERTY IMAGE
========================================================= */

.property-image-container{
  position:relative;

  width:100%;
  height:245px;

  background:
    linear-gradient(
      135deg,
      #e8edf3,
      #f5f7fa
    );

  overflow:hidden;
}

.property-image{
  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .5s ease;

  cursor:pointer;
}

.property-card:hover
.property-image{
  transform:scale(1.025);
}

.property-image-placeholder{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:8px;

  color:#98a2b3;

  font-size:14px;
}


/* =========================================================
   IMAGE BADGES
========================================================= */

.image-badge{
  position:absolute;

  top:13px;
  left:13px;

  z-index:2;

  padding:
    6px 10px;

  border-radius:999px;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:blur(8px);

  color:var(--text);

  font-size:11px;
  font-weight:800;

  box-shadow:
    0 4px 12px
    rgba(0,0,0,.10);
}

.image-badge.available{
  color:var(--success);
}

.photos-badge{
  position:absolute;

  right:13px;
  bottom:13px;

  z-index:2;

  padding:
    6px 10px;

  border-radius:999px;

  background:
    rgba(0,0,0,.68);

  color:white;

  font-size:11px;
  font-weight:700;

  backdrop-filter:blur(8px);
}


/* =========================================================
   CARD CONTENT
========================================================= */

.property-content{
  padding:
    17px 18px 18px;

  display:flex;
  flex-direction:column;

  gap:11px;

  flex:1;

  min-width:0;
}

.property-location{
  display:flex;

  align-items:center;

  gap:5px;

  color:var(--text-soft);

  font-size:13px;
  font-weight:650;
}

.property-title{
  font-size:21px;

  font-weight:850;

  line-height:1.15;

  color:var(--text);

  letter-spacing:-.025em;
}

.property-address{
  color:var(--text-soft);

  font-size:13px;

  line-height:1.4;

  min-height:18px;
}


/* =========================================================
   PRICE
========================================================= */

.property-price{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:
    12px 0;

  border-top:
    1px solid
    var(--border);

  border-bottom:
    1px solid
    var(--border);
}

.price-label{
  font-size:10px;

  color:var(--text-soft);

  text-transform:uppercase;

  font-weight:800;

  letter-spacing:.06em;
}

.price-value{
  color:var(--primary);

  font-size:22px;

  font-weight:850;

  text-align:right;

  line-height:1.1;
}


/* =========================================================
   COSTS
========================================================= */

.property-costs{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}

.cost-box{
  background:#f8fafc;

  border:
    1px solid
    #eef1f5;

  border-radius:10px;

  padding:9px;
}

.cost-label{
  display:block;

  color:var(--text-soft);

  font-size:9px;

  font-weight:800;

  text-transform:uppercase;

  margin-bottom:2px;

  letter-spacing:.04em;
}

.cost-value{
  display:block;

  color:var(--text);

  font-size:13px;

  font-weight:750;

  word-break:break-word;
}


/* =========================================================
   PET / AMENITIES
========================================================= */

.property-amenities{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:7px;
}

.amenity-chip{
  display:flex;

  align-items:center;

  gap:5px;

  padding:
    7px 9px;

  border-radius:8px;

  background:#f2f4f7;

  color:#475467;

  font-size:12px;

  font-weight:650;

  min-width:0;
}

.amenity-chip.yes{
  color:#15803d;
  background:#f0fdf4;
}

.amenity-chip.no{
  color:#b42318;
  background:#fff5f5;
}


/* =========================================================
   DESCRIPTION BUTTON
========================================================= */

.description-button{
  width:100%;

  min-height:39px;

  border:
    1px solid
    var(--border);

  background:white;

  color:var(--text);

  border-radius:10px;

  font-size:13px;
  font-weight:750;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:7px;

  transition:
    background .2s ease,
    border-color .2s ease,
    color .2s ease;
}

.description-button:hover{
  background:#f8fafc;
  border-color:var(--active);
  color:var(--active);
}


/* =========================================================
   WHATSAPP BUTTON
========================================================= */

.property-actions{
  margin-top:auto;
  padding-top:1px;
}

.whatsapp-button{
  width:100%;

  min-height:46px;

  border:none;

  border-radius:10px;

  background:#18b957;

  color:white;

  font-weight:800;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  transition:
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;

  box-shadow:
    0 5px 15px
    rgba(24,185,87,.15);
}

.whatsapp-button:hover{
  background:#109b49;

  transform:translateY(-1px);

  box-shadow:
    0 7px 18px
    rgba(24,185,87,.23);
}


/* =========================================================
   DESCRIPTION MODAL
========================================================= */

.description-modal{
  position:fixed;

  inset:0;

  z-index:2000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(5px);
}

.description-modal.active{
  display:flex;
}

.description-panel{
  width:min(
    680px,
    100%
  );

  max-height:
    min(
      720px,
      85vh
    );

  overflow-y:auto;

  background:white;

  border-radius:20px;

  box-shadow:var(--shadow-lg);

  padding:26px;

  position:relative;

  animation:
    modalIn .22s ease both;
}

@keyframes modalIn{

  from{
    opacity:0;

    transform:
      translateY(15px)
      scale(.98);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }
}

.description-close{
  position:absolute;

  top:14px;
  right:14px;

  width:40px;
  height:40px;

  border:none;

  border-radius:50%;

  background:#f2f4f7;

  color:var(--text);

  font-size:24px;

  line-height:1;
}

.description-close:hover{
  background:#e5e7eb;
}

.description-modal-title{
  padding-right:48px;

  font-size:24px;

  font-weight:850;

  line-height:1.2;

  margin-bottom:7px;
}

.description-modal-location{
  color:var(--text-soft);

  font-size:14px;

  margin-bottom:20px;
}

.description-modal-text{
  color:#344054;

  font-size:15px;

  line-height:1.7;

  white-space:pre-line;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{
  grid-column:1 / -1;

  background:white;

  border:
    1px solid
    var(--border);

  border-radius:var(--radius);

  padding:70px 20px;

  text-align:center;

  box-shadow:
    0 6px 20px
    rgba(16,24,40,.055);
}

.empty-icon{
  font-size:42px;
  margin-bottom:15px;
}

.empty-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:7px;
}

.empty-text{
  color:var(--text-soft);
  margin-bottom:20px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
  grid-column:1 / -1;

  display:flex;

  align-items:center;
  justify-content:center;

  min-height:300px;

  flex-direction:column;

  gap:14px;

  color:var(--text-soft);
}

.spinner{
  width:42px;
  height:42px;

  border:
    4px solid
    #e5e7eb;

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================================================
   ERROR
========================================================= */

.error-state{
  grid-column:1 / -1;

  background:white;

  border:
    1px solid
    #fecaca;

  border-radius:var(--radius);

  padding:40px 20px;

  text-align:center;

  color:#991b1b;
}

.retry-button{
  margin-top:18px;

  padding:
    10px 17px;

  border:none;

  border-radius:9px;

  background:var(--primary);

  color:white;

  font-weight:700;

  cursor:pointer;
}


/* =========================================================
   WHATSAPP FLOTANTE
========================================================= */

.floating-whatsapp{
  position:fixed;

  right:22px;
  bottom:22px;

  width:60px;
  height:60px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#18b957;

  color:white;

  text-decoration:none;

  font-size:28px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.20);

  z-index:100;

  transition:
    transform .2s ease;
}

.floating-whatsapp:hover{
  transform:scale(1.07);
}


/* =========================================================
   GALLERY
========================================================= */

.gallery{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.94);

  z-index:3000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.gallery.active{
  display:flex;
}

.gallery-image{
  max-width:min(
    1100px,
    92vw
  );

  max-height:85vh;

  object-fit:contain;

  border-radius:10px;

  user-select:none;
}

.gallery-close{
  position:absolute;

  top:18px;
  right:22px;

  width:46px;
  height:46px;

  border:none;

  border-radius:50%;

  background:
    rgba(255,255,255,.14);

  color:white;

  font-size:26px;

  z-index:10;
}

.gallery-close:hover{
  background:
    rgba(255,255,255,.25);
}

.gallery-prev,
.gallery-next{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;
  height:48px;

  border:none;

  border-radius:50%;

  background:
    rgba(255,255,255,.14);

  color:white;

  font-size:24px;

  z-index:10;
}

.gallery-prev{
  left:22px;
}

.gallery-next{
  right:22px;
}

.gallery-counter{
  position:absolute;

  bottom:20px;
  left:50%;

  transform:translateX(-50%);

  color:white;

  background:
    rgba(0,0,0,.45);

  padding:
    7px 12px;

  border-radius:999px;

  font-size:13px;
  font-weight:700;
}


/* =========================================================
   MOBILE
========================================================= */

@media screen and (max-width:800px){

  html,
  body{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
    overflow-x:hidden !important;
  }


  /* HERO */

  .hero{
    width:100% !important;
    overflow:hidden !important;
  }

  .hero-image{
    width:100% !important;

    height:62vw !important;

    min-height:220px !important;
    max-height:360px !important;
  }

  .hero-background{
    width:100% !important;
    height:100% !important;

    inset:0 !important;

    background-position:center center !important;
    background-size:cover !important;
  }

  .hero-bottom{
    width:100% !important;

    padding:
      27px 16px 30px !important;
  }

  .hero-content{
    width:100% !important;
    max-width:100% !important;
  }

  .hero-title{
    width:100% !important;

    font-size:
      clamp(
        2rem,
        8vw,
        3rem
      ) !important;

    line-height:1.08 !important;

    letter-spacing:-.035em !important;

    overflow-wrap:anywhere !important;
  }

  .hero-subtitle{
    width:100% !important;

    font-size:
      clamp(
        1.05rem,
        4.8vw,
        1.3rem
      ) !important;

    line-height:1.4 !important;
  }


  /* MAIN */

  main{
    width:100% !important;

    max-width:100% !important;

    margin:0 !important;

    padding:
      14px 0 100px !important;

    overflow:hidden !important;
  }


  /* FILTER */

  .filters{
    width:
      calc(100% - 20px) !important;

    margin:
      0 10px 20px !important;

    padding:16px !important;

    border-radius:16px !important;
  }

  .filters-header{
    flex-direction:column !important;

    align-items:flex-start !important;

    gap:8px !important;

    margin-bottom:18px !important;
  }

  .filters-title{
    font-size:19px !important;
  }

  .results-count{
    font-size:14px !important;
  }

  .clear-filters{
    font-size:14px !important;
  }

  .filter-grid{
    grid-template-columns:1fr !important;
    gap:18px !important;
  }


  /* AMBIENTES */

  .environment-buttons{
    grid-template-columns:

/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizarTexto(valor){

  if(
    valor === null ||
    valor === undefined
  ){
    return "";
  }

  return String(valor)
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


/* =========================================================
   NORMALIZAR CLAVE
========================================================= */

function normalizarClave(valor){

  return normalizarTexto(valor)
    .replace(
      /[^a-z0-9]/g,
      ""
    );
}


/* =========================================================
   OBTENER CAMPO
========================================================= */

function obtenerCampo(
  propiedad,
  nombres
){

  for(
    const nombre of nombres
  ){

    const clave =
      normalizarClave(nombre);

    if(
      Object.prototype.hasOwnProperty.call(
        propiedad,
        clave
      )
    ){

      const valor =
        propiedad[clave];

      if(
        valor !== null &&
        valor !== undefined &&
        String(valor).trim() !== ""
      ){

        return String(valor).trim();

      }

    }

  }

  return "";
}


/* =========================================================
   BUSCAR CAMPO FLEXIBLE
========================================================= */

function obtenerCampoFlexible(
  propiedad,
  nombres
){

  /* Primero intenta coincidencia exacta */

  const exacto =
    obtenerCampo(
      propiedad,
      nombres
    );

  if(exacto){
    return exacto;
  }


  /* Luego busca claves similares */

  const claves =
    Object.keys(propiedad);

  for(
    const clave of claves
  ){

    const normalizada =
      normalizarClave(clave);

    for(
      const nombre of nombres
    ){

      const buscada =
        normalizarClave(nombre);

      if(
        normalizada.includes(buscada)
      ){

        const valor =
          propiedad[clave];

        if(
          valor !== null &&
          valor !== undefined &&
          String(valor).trim() !== ""
        ){

          return String(valor).trim();

        }

      }

    }

  }

  return "";
}


/* =========================================================
   VERDADERO
========================================================= */

function esVerdadero(valor){

  const texto =
    normalizarTexto(valor);

  if(!texto){
    return false;
  }

  return [

    "si",
    "sí",
    "yes",
    "true",
    "1",
    "apto",
    "apta",
    "acepta",
    "permitido",
    "permitida",
    "incluido",
    "incluida",
    "disponible",
    "ok",
    "✓",
    "✔",
    "x",
    "check"

  ].includes(texto);

}


/* =========================================================
   DRIVE ID
========================================================= */

function extraerDriveId(url){

  if(!url){
    return "";
  }

  const texto =
    String(url).trim();


  let match =
    texto.match(
      /\/file\/d\/([a-zA-Z0-9_-]+)/
    );

  if(match){
    return match[1];
  }


  match =
    texto.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );

  if(match){
    return match[1];
  }


  match =
    texto.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );

  if(match){
    return match[1];
  }


  if(
    /^[a-zA-Z0-9_-]{20,}$/.test(texto)
  ){

    return texto;

  }

  return "";
}


/* =========================================================
   CONVERTIR IMAGEN DRIVE
========================================================= */

function convertirImagenDrive(url){

  if(!url){
    return "";
  }

  const texto =
    String(url).trim();

  const id =
    extraerDriveId(texto);

  if(!id){

    return texto;

  }


  /*
    thumbnail suele ser la opción
    más rápida para imágenes públicas
  */

  return (
    "https://drive.google.com/thumbnail" +
    "?id=" +
    encodeURIComponent(id) +
    "&sz=w1600"
  );

}


/* =========================================================
   OBTENER FOTOS
========================================================= */

function obtenerFotos(propiedad){

  const fotos=[];

  Object.keys(propiedad)

    .filter(
      clave =>
        clave === "fotos" ||
        /^fotos\d+$/.test(clave)
    )

    .sort(
      (a,b)=>{

        if(a==="fotos"){
          return -1;
        }

        if(b==="fotos"){
          return 1;
        }

        const na =
          parseInt(
            a.replace("fotos","")
          ) || 0;

        const nb =
          parseInt(
            b.replace("fotos","")
          ) || 0;

        return na-nb;

      }
    )

    .forEach(
      clave=>{

        const valor =
          propiedad[clave];

        if(!valor){
          return;
        }

        const urls =
          String(valor)
            .split(
              /\s*,\s*|\n+/
            )
            .map(
              x=>x.trim()
            )
            .filter(Boolean);

        urls.forEach(
          url=>{

            const imagen =
              convertirImagenDrive(url);

            if(
              imagen &&
              !fotos.includes(imagen)
            ){

              fotos.push(imagen);

            }

          }
        );

      }
    );

  return fotos;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor){

  return String(
    valor ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   PRECIO
========================================================= */

function formatearPrecio(valor){

  if(!valor){
    return "Consultar";
  }

  return String(valor).trim();

}


/* =========================================================
   PORTADA
========================================================= */

function cargarImagenPortada(url){

  if(!url){
    return;
  }

  const imagen =
    convertirImagenDrive(url);

  if(!imagen){
    return;
  }


  /*
    Cargamos primero con Image()
    para comprobar que realmente
    puede descargarse.
  */

  const test =
    new Image();

  test.onload = ()=>{

    elements.heroBackground.style
      .backgroundImage =
      `url("${imagen}")`;

    elements.heroBackground.style
      .opacity = "1";

  };


  test.onerror = ()=>{

    console.warn(
      "No se pudo cargar la portada:",
      imagen
    );

    /*
      Segundo intento con la URL original.
    */

    const original =
      String(url).trim();

    if(original !== imagen){

      elements.heroBackground.style
        .backgroundImage =
        `url("${original}")`;

    }

  };


  test.src =
    imagen;

}

async function obtenerConfiguracionDesde(apiUrl){

  const response =
    await fetch(
      apiUrl +
      "?action=config&t=" +
      Date.now(),
      {
        method:"GET",
        cache:"no-store"
      }
    );

  if(!response.ok){
    throw new Error(
      "HTTP " +
      response.status
    );
  }

  const data =
    await response.json();

  return (
    data?.config ||
    data?.CONFIG ||
    data?.data?.config ||
    data?.data ||
    data
  );

}

/* =========================================================
CARGAR CSV
========================================================= */

async function cargarPropiedades(){

  try{

    mostrarLoading();


    const response =
      await fetch(
        CSV_URL +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "No se pudo descargar el CSV"
      );

    }


    const csv =
      await response.text();


    Papa.parse(
      csv,
      {

        header:true,

        skipEmptyLines:true,

        transformHeader:
          header =>
            normalizarClave(
              header
            ),

        complete:
          resultado =>{

            try{

              procesarPropiedades(
                resultado.data
              );

            }

            catch(error){

              console.error(error);

              mostrarError();

            }

          },

        error:
          error =>{

            console.error(error);

            mostrarError();

          }

      }
    );

  }

  catch(error){

    console.error(
      "Error cargando CSV:",
      error
    );

    mostrarError();

  }

}


/* =========================================================
   PROCESAR PROPIEDADES
========================================================= */

function procesarPropiedades(
  propiedades
){

  state.properties =
    propiedades

      .filter(
        propiedad =>
          Object.values(
            propiedad
          ).some(
            valor =>
              String(
                valor || ""
              ).trim() !== ""
          )
      )

      .map(
        propiedad =>{

          return {

            raw:propiedad,

            fotos:
              obtenerFotos(
                propiedad
              ),

            ambientes:
              obtenerCampoFlexible(
                propiedad,
                [
                  "ambientes"
                ]
              ),

            barrio:
              obtenerCampoFlexible(
                propiedad,
                [
                  "barrio"
                ]
              ),

            direccion:
              obtenerCampoFlexible(
                propiedad,
                [
                  "direccion"
                ]
              ),

            valor:
              obtenerCampoFlexible(
                propiedad,
                [
                  "valor",
                  "precio"
                ]
              ),

            expensas:
              obtenerCampoFlexible(
                propiedad,
                [
                  "expensas"
                ]
              ),

            gastos:
              obtenerCampoFlexible(
                propiedad,
                [
                  "gastos"
                ]
              ),

            perro:
              obtenerCampoFlexible(
                propiedad,
                [
                  "perro",
                  "apto perro",
                  "aptoperro",
                  "mascotas perro"
                ]
              ),

            gato:
              obtenerCampoFlexible(
                propiedad,
                [
                  "gato",
                  "apto gato",
                  "aptogato",
                  "mascotas gato"
                ]
              ),

            lavado:
              obtenerCampoFlexible(
                propiedad,
                [
                  "lavado",
                  "lavarropas",
                  "lavadora"
                ]
              ),

            disponibilidad:
              obtenerCampoFlexible(
                propiedad,
                [
                  "disponibilidad",
                  "disponible"
                ]
              ),

            descripcion:
              obtenerCampoFlexible(
                propiedad,
                [
                  "descripcion",
                  "descripción"
                ]
              )

          };

        }
      );


  construirFiltros();

  aplicarFiltros();

}


/* =========================================================
   CONSTRUIR FILTROS
========================================================= */

function construirFiltros(){

  const ambientes =
    state.properties

      .map(
        propiedad =>
          propiedad.ambientes
      )

      .filter(Boolean);


  state.environments =
    [
      ...new Set(
        ambientes.map(
          valor =>
            String(valor).trim()
        )
      )
    ];


  state.environments.sort(
    ordenarValores
  );


  elements.environmentButtons
    .innerHTML = "";


  elements.environmentButtons
    .appendChild(
      crearBotonAmbientes(
        "Todos",
        ""
      )
    );


  state.environments
    .forEach(
      ambiente =>{

        elements.environmentButtons
          .appendChild(
            crearBotonAmbientes(
              ambiente,
              ambiente
            )
          );

      }
    );


  const barrios =
    state.properties

      .map(
        propiedad =>
          propiedad.barrio
      )

      .filter(Boolean);


  state.neighborhoods =
    [
      ...new Set(
        barrios.map(
          barrio =>
            String(
              barrio
            ).trim()
        )
      )
    ];


  state.neighborhoods.sort(
    (a,b)=>
      a.localeCompare(
        b,
        "es",
        {
          sensitivity:"base"
        }
      )
  );


  elements.neighborhoodSelect
    .innerHTML =
      `
        <option value="">
          Todos los barrios
        </option>
      `;


  state.neighborhoods
    .forEach(
      barrio =>{

        const option =
          document.createElement(
            "option"
          );

        option.value =
          barrio;

        option.textContent =
          barrio;

        elements.neighborhoodSelect
          .appendChild(
            option
          );

      }
    );

}


/* =========================================================
   ORDENAR
========================================================= */

function ordenarValores(
  a,
  b
){

  const na =
    parseFloat(
      String(a)
        .replace(",",".")
    );

  const nb =
    parseFloat(
      String(b)
        .replace(",",".")
    );


  if(
    !Number.isNaN(na) &&
    !Number.isNaN(nb)
  ){

    return na-nb;

  }


  return String(a)
    .localeCompare(
      String(b),
      "es",
      {
        sensitivity:"base"
      }
    );

}


/* =========================================================
   BOTONES AMBIENTES
========================================================= */

function crearBotonAmbientes(
  texto,
  valor
){

  const button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "environment-button";

  button.textContent =
    texto;

  button.dataset.value =
    valor;


  if(
    state.selectedEnvironment ===
    valor
  ){

    button.classList.add(
      "active"
    );

  }


  button.addEventListener(
    "click",
    ()=>{

      state.selectedEnvironment =
        valor;

      actualizarBotonesAmbientes();

      aplicarFiltros();

    }
  );


  return button;

}


function actualizarBotonesAmbientes(){

  document
    .querySelectorAll(
      ".environment-button"
    )
    .forEach(
      button =>{

        const valor =
          button.dataset.value;

        button.classList.toggle(
          "active",
          valor ===
          state.selectedEnvironment
        );

      }
    );

}


/* =========================================================
   FILTROS
========================================================= */

function aplicarFiltros(){

  const ambienteSeleccionado =
    normalizarTexto(
      state.selectedEnvironment
    );

  const barrioSeleccionado =
    normalizarTexto(
      state.neighborhood
    );


  state.filteredProperties =
    state.properties.filter(
      propiedad =>{


        if(
          ambienteSeleccionado
        ){

          const ambiente =
            normalizarTexto(
              propiedad.ambientes
            );

          if(
            ambiente !==
            ambienteSeleccionado
          ){

            return false;

          }

        }


        if(
          barrioSeleccionado
        ){

          const barrio =
            normalizarTexto(
              propiedad.barrio
            );

          if(
            barrio !==
            barrioSeleccionado
          ){

            return false;

          }

        }


        if(
          state.dog &&
          !esVerdadero(
            propiedad.perro
          )
        ){

          return false;

        }


        if(
          state.cat &&
          !esVerdadero(
            propiedad.gato
          )
        ){

          return false;

        }


        if(
          state.laundry &&
          !esVerdadero(
            propiedad.lavado
          )
        ){

          return false;

        }


        return true;

      }
    );


  renderizarPropiedades();

  actualizarContador();

}

  const cantidad =

/* =========================================================
   DESCRIPCIÓN
========================================================= */

function abrirDescripcion(
  propiedad
){

  if(
    !propiedad ||
    !propiedad.descripcion
  ){

    return;

  }


  state.description.property =
    propiedad;

  state.description.scrollPosition =
    window.scrollY;

  state.description.open =
    true;


  const ambiente =
    propiedad.ambientes;


  if(ambiente){

    const ambienteNormalizado =
      normalizarTexto(
        ambiente
      );


    elements.descriptionModalTitle
      .textContent =
        ambienteNormalizado.includes(
          "amb"
        )

          ? ambiente

          : ambienteNormalizado === "1"

            ? "1 ambiente"

            : `${ambiente} ambientes`;

  }

  else{

    elements.descriptionModalTitle
      .textContent =
      "Departamento";

  }


  const ubicacion=[];


  if(propiedad.barrio){

    ubicacion.push(
      propiedad.barrio
    );

  }


  if(propiedad.direccion){

    ubicacion.push(
      propiedad.direccion
    );

  }


  elements.descriptionModalLocation
    .textContent =
    ubicacion.join(" · ");


  elements.descriptionModalText
    .textContent =
    propiedad.descripcion;


  history.pushState(
    {
      description:true
    },
    "",
    "#descripcion"
  );


  document.body.classList.add(
    "modal-open"
  );


  elements.descriptionModal
    .classList.add(
      "active"
    );


  elements.descriptionModal
    .setAttribute(
      "aria-hidden",
      "false"
    );

}


function cerrarDescripcion(
  usarHistorial=true
){

  if(
    !state.description.open
  ){

    return;

  }


  state.description.open =
    false;

  state.description.property =
    null;


  document.body.classList.remove(
    "modal-open"
  );


  elements.descriptionModal
    .classList.remove(
      "active"
    );


  elements.descriptionModal
    .setAttribute(
      "aria-hidden",
      "true"
    );


  if(
    usarHistorial &&
    location.hash ===
    "#descripcion"
  ){

    history.back();

  }


  requestAnimationFrame(
    ()=>{

      window.scrollTo(
        0,
        state.description.scrollPosition
      );

    }
  );

}

          No pudimos cargar
          los departamentos.
        </strong>

        <p style="margin-top:8px;">
          Revisá que la planilla
          esté publicada correctamente
          como CSV.
        </p>

        <button
          class="retry-button"
          onclick="location.reload()"
        >
          Reintentar
        </button>

      </div>
    `;


  elements.resultsCount.textContent =
    "No se pudieron cargar las propiedades";

}


/* =========================================================
   LIMPIAR FILTROS
========================================================= */

function limpiarFiltros(){

  state.selectedEnvironment="";
  state.neighborhood="";

  state.dog=false;
  state.cat=false;
  state.laundry=false;


  elements.neighborhoodSelect.value="";


  elements.filterDog
    .classList.remove(
      "active"
    );

  elements.filterCat
    .classList.remove(
      "active"
    );

  elements.filterLaundry
    .classList.remove(
      "active"
    );


  actualizarBotonesAmbientes();

  aplicarFiltros();

}


/* =========================================================
   EVENTOS FILTROS
========================================================= */

elements.neighborhoodSelect
  .addEventListener(
    "change",
    event=>{

      state.neighborhood =
        event.target.value;

      aplicarFiltros();

    }
  );


elements.filterDog
  .addEventListener(
    "click",
    ()=>{

      state.dog =
        !state.dog;

      elements.filterDog
        .classList.toggle(
          "active",
          state.dog
        );

      aplicarFiltros();

    }
  );


elements.filterCat
  .addEventListener(
    "click",
    ()=>{

      state.cat =
        !state.cat;

      elements.filterCat
        .classList.toggle(
          "active",
          state.cat
        );

      aplicarFiltros();

    }
  );


elements.filterLaundry
  .addEventListener(
    "click",
    ()=>{

      state.laundry =
        !state.laundry;

      elements.filterLaundry
        .classList.toggle(
          "active",
          state.laundry
        );

      aplicarFiltros();

    }
  );


elements.clearFilters
  .addEventListener(
    "click",
    limpiarFiltros
  );


/* =========================================================
   GALERÍA
========================================================= */

function abrirGaleria(
  fotos,
  indice=0
){

  if(
    !fotos ||
    fotos.length===0
  ){

    return;

  }


  state.gallery.images =
    fotos;

  state.gallery.index =
    indice;

  state.gallery.scrollPosition =
    window.scrollY;

  state.gallery.open =
    true;


  history.pushState(
    {
      gallery:true
    },
    "",
    "#galeria"
  );


  document.body.classList.add(
    "modal-open"
  );


  elements.gallery
    .classList.add(
      "active"
    );


  elements.gallery
    .setAttribute(
      "aria-hidden",
      "false"
    );


  actualizarGaleria();

}


function cerrarGaleria(
  usarHistorial=true
){

  if(
    !state.gallery.open
  ){

    return;

  }


  state.gallery.open =
    false;


  document.body.classList.remove(
    "modal-open"
  );


  elements.gallery
    .classList.remove(
      "active"
    );


  elements.gallery
    .setAttribute(
      "aria-hidden",
      "true"
    );


  if(
    usarHistorial &&
    location.hash ===
    "#galeria"
  ){

    history.back();

  }


  requestAnimationFrame(
    ()=>{

      window.scrollTo(
        0,
        state.gallery.scrollPosition
      );

    }
  );

}


function actualizarGaleria(){

  const fotos =
    state.gallery.images;

  const indice =
    state.gallery.index;


  if(!fotos.length){
    return;
  }


  elements.galleryImage.src =
    fotos[indice];


  elements.galleryImage.alt =
    `Foto ${
      indice+1
    } del departamento`;


  elements.galleryCounter.textContent =
    `${
      indice+1
    } / ${
      fotos.length
    }`;


  elements.galleryPrev.style.display =
    fotos.length>1
      ? "block"
      : "none";


  elements.galleryNext.style.display =
    fotos.length>1
      ? "block"
      : "none";

}


function fotoAnterior(){

  const cantidad =
    state.gallery.images.length;


  if(cantidad<=1){
    return;
  }


  state.gallery.index =
    (
      state.gallery.index -
      1 +
      cantidad
    ) %
    cantidad;


  actualizarGaleria();

}


function fotoSiguiente(){

  const cantidad =
    state.gallery.images.length;


  if(cantidad<=1){
    return;
  }


  state.gallery.index =
    (
      state.gallery.index +
      1
    ) %
    cantidad;


  actualizarGaleria();

}


/* =========================================================
   EVENTOS GALERÍA
========================================================= */

elements.galleryClose
  .addEventListener(
    "click",
    ()=>{

      cerrarGaleria(true);

    }
  );


elements.galleryPrev
  .addEventListener(
    "click",
    fotoAnterior
  );


elements.galleryNext
  .addEventListener(
    "click",
    fotoSiguiente
  );


elements.gallery
  .addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        elements.gallery
      ){

        cerrarGaleria(true);

      }

    }
  );


/* =========================================================
   DESCRIPTION EVENTS
========================================================= */

elements.descriptionClose
  .addEventListener(
    "click",
    ()=>{

      cerrarDescripcion(true);

    }
  );


elements.descriptionModal
  .addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        elements.descriptionModal
      ){

        cerrarDescripcion(true);

      }

    }
  );


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      state.description.open
    ){

      if(
        event.key ===
        "Escape"
      ){

        cerrarDescripcion(true);

      }

      return;

    }


    if(
      !state.gallery.open
    ){

      return;

    }


    if(
      event.key ===
      "Escape"
    ){

      cerrarGaleria(true);

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      fotoAnterior();

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      fotoSiguiente();

    }

  }
);


/* =========================================================
   BOTÓN ATRÁS
========================================================= */

window.addEventListener(
  "popstate",
  ()=>{

    if(
      state.gallery.open
    ){

      cerrarGaleria(false);

      return;

    }


    if(
      state.description.open
    ){

      cerrarDescripcion(false);

      return;

    }

  }
);


/* =========================================================
   SWIPE
========================================================= */

let touchStartX=0;
let touchEndX=0;


elements.gallery
  .addEventListener(
    "touchstart",
    event=>{

      touchStartX =
        event.changedTouches[0]
          .screenX;

    },
    {
      passive:true
    }
  );


elements.gallery
  .addEventListener(
    "touchend",
    event=>{

      touchEndX =
        event.changedTouches[0]
          .screenX;


      const diferencia =
        touchEndX -
        touchStartX;


      if(
        Math.abs(diferencia)<50
      ){

        return;

      }


      if(diferencia>0){

        fotoAnterior();

      }

      else{

        fotoSiguiente();

      }

    },
    {
      passive:true
    }
  );


/* =========================================================
   INICIALIZACIÓN
========================================================= */

async function iniciar(){

  /*
    Cargamos configuración y propiedades
    independientemente.
  */

  await cargarConfiguracion();

  await cargarPropiedades();

}


iniciar();

</script>
